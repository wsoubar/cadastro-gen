<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />

  <!-- Form / Registration Document -->
  <rect x="14" y="10" width="36" height="44" rx="6" fill="#FFFFFF" opacity="0.96" />

  <!-- Clipboard Top Clip -->
  <rect x="23" y="7" width="18" height="6" rx="3" fill="#E0E7FF" />
  <rect x="25" y="6" width="14" height="4" rx="2" fill="#4338CA" />

  <!-- User Avatar on Registration Card -->
  <circle cx="32" cy="22" r="5" fill="#4F46E5" />
  <path d="M23 34 C23 29 27 28 32 28 C37 28 41 29 41 34" fill="#4F46E5" />

  <!-- Form Text Lines -->
  <rect x="21" y="38" width="22" height="2.5" rx="1.25" fill="#CBD5E1" />
  <rect x="21" y="43" width="15" height="2.5" rx="1.25" fill="#CBD5E1" />

  <!-- Green Verification / Validation Check Badge -->
  <g filter="url(#shadow)">
    <circle cx="47" cy="47" r="11" fill="url(#checkGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <path d="M42.5 47.2 L45.8 50.5 L51.8 44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
